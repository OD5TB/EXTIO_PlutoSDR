name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x86-windows
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      LIBIIO_TAG: "v0.25"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache env (for vcpkg binary cache)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install pkg-config (libiio's CMake requires it to find libusb / libxml2)
        run: choco install -y pkgconfiglite --no-progress

      - name: Install libiio's dependencies via vcpkg (x86)
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          Write-Host "Using vcpkg: $vcpkg"
          & $vcpkg install libxml2:x86-windows libusb:x86-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg deps install failed ($LASTEXITCODE)" }
          # Confirm vcpkg dropped .pc files for libusb / libxml2
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT\installed\x86-windows\lib\pkgconfig\*.pc" -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name

      - name: Clone libiio source
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:LIBIIO_TAG https://github.com/analogdevicesinc/libiio.git libiio-src
          Write-Host "libiio @ $(git -C libiio-src rev-parse HEAD)"

      - name: Build libiio (x86) from source
        shell: pwsh
        run: |
          $toolchain     = "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          $installPrefix = "$PWD\libiio-install"

          # Tell pkg-config where vcpkg dropped its .pc files. libiio's CMake
          # uses pkg_check_modules() to find libusb-1.0 and libxml2.
          $env:PKG_CONFIG_PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x86-windows\lib\pkgconfig"
          Write-Host "PKG_CONFIG_PATH = $env:PKG_CONFIG_PATH"
          pkg-config --modversion libusb-1.0
          pkg-config --modversion libxml-2.0

          cmake -S libiio-src -B libiio-build -A Win32 `
                -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
                -DVCPKG_TARGET_TRIPLET=x86-windows `
                -DCMAKE_INSTALL_PREFIX="$installPrefix" `
                -DCSHARP_BINDINGS=OFF `
                -DPYTHON_BINDINGS=OFF `
                -DCPP_BINDINGS=OFF `
                -DWITH_DOC=OFF `
                -DWITH_TESTS=OFF `
                -DWITH_EXAMPLES=OFF `
                -DENABLE_PACKAGING=OFF
          if ($LASTEXITCODE -ne 0) { throw "libiio configure failed" }

          cmake --build libiio-build --config Release --target install --parallel
          if ($LASTEXITCODE -ne 0) { throw "libiio build failed" }

          Write-Host "--- libiio install tree ---"
          Get-ChildItem $installPrefix -Recurse -File | Select-Object FullName

          "LIBIIO_ROOT=$installPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_X86_BIN=$env:VCPKG_INSTALLATION_ROOT\installed\x86-windows\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure ExtIO project (CMake, Win32 / x86)
        shell: pwsh
        run: cmake -S . -B build -A Win32 -DLIBIIO_ROOT="$env:LIBIIO_ROOT"

      - name: Build ExtIO project (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Stage release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build\Release\ExtIO_PlutoSDR.dll release\
          Copy-Item "$env:LIBIIO_ROOT\bin\*.dll" release\ -Force -ErrorAction SilentlyContinue
          Get-ChildItem "$env:VCPKG_X86_BIN\*.dll" -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName release\ -Force }
          Copy-Item README.md release\ -ErrorAction SilentlyContinue
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtIO_PlutoSDR-win32
          path: release/**
          if-no-files-found: error
