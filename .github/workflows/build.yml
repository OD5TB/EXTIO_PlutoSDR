name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      LIBIIO_TAG: "v0.25"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install innoextract (for unpacking the libiio installer)
        run: choco install -y innoextract --no-progress

      - name: Download libiio Windows artifact (via release API)
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'github-actions'; 'Accept' = 'application/vnd.github+json' }
          $api = "https://api.github.com/repos/analogdevicesinc/libiio/releases/tags/$env:LIBIIO_TAG"
          Write-Host "API: $api"
          $rel = Invoke-RestMethod -Uri $api -Headers $headers

          # Prefer the pre-extracted zip; fall back to the Inno Setup installer.
          $asset = $rel.assets | Where-Object { $_.name -like "*windows*.zip" } | Select-Object -First 1
          $kind  = "zip"
          if (-not $asset) {
              $asset = $rel.assets | Where-Object { $_.name -like "*setup.exe" } | Select-Object -First 1
              $kind  = "exe"
          }
          if (-not $asset) {
              Write-Host "Available assets:"
              $rel.assets | ForEach-Object { Write-Host " - $($_.name)" }
              throw "No Windows asset in release $env:LIBIIO_TAG"
          }
          Write-Host "Picked asset ($kind): $($asset.name)"
          $outFile = if ($kind -eq "zip") { "libiio.zip" } else { "libiio-setup.exe" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $outFile -UseBasicParsing
          "LIBIIO_KIND=$kind" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install innoextract (only if we got an installer)
        if: env.LIBIIO_KIND == 'exe'
        run: choco install -y innoextract --no-progress

      - name: Extract libiio
        shell: pwsh
        run: |
          if ($env:LIBIIO_KIND -eq "zip") {
              Expand-Archive -Path libiio.zip -DestinationPath libiio-raw -Force
          } else {
              innoextract -d libiio-raw libiio-setup.exe
          }
          Write-Host "--- top-level layout ---"
          Get-ChildItem -Recurse -Directory libiio-raw | Select-Object -First 40 FullName
          Write-Host "--- looking for iio.h ---"
          Get-ChildItem -Recurse -Filter iio.h libiio-raw | Select-Object FullName
          Write-Host "--- looking for 32-bit libiio.lib ---"
          Get-ChildItem -Recurse -Filter libiio.lib libiio-raw | Select-Object FullName
      - name: Stage libiio (32-bit)
        shell: pwsh
        run: |
          $iioH = Get-ChildItem -Recurse -Filter iio.h libiio-raw | Sort-Object FullName | Select-Object -First 1
          if (-not $iioH) { throw "iio.h not found" }
          $lib32 = Get-ChildItem -Recurse -Filter libiio.lib libiio-raw |
                   Where-Object { $_.FullName -match '(MS32|i686|win32|x86)' -and $_.FullName -notmatch '(MS64|x86_64|x64)' } |
                   Sort-Object FullName | Select-Object -First 1
          if (-not $lib32) {
              $lib32 = Get-ChildItem -Recurse -Filter libiio.lib libiio-raw |
                       Where-Object { $_.FullName -notmatch '(MS64|x86_64|x64)' } |
                       Sort-Object FullName | Select-Object -First 1
          }
          if (-not $lib32) { throw "32-bit libiio.lib not found" }
          $libDir = Split-Path $lib32.FullName -Parent
          $incDir = Split-Path $iioH.FullName  -Parent
          New-Item -ItemType Directory -Force -Path libiio\include | Out-Null
          New-Item -ItemType Directory -Force -Path libiio\lib     | Out-Null
          New-Item -ItemType Directory -Force -Path libiio\bin     | Out-Null
          Copy-Item "$incDir\*"     libiio\include -Recurse -Force
          Copy-Item "$libDir\*.lib" libiio\lib                -Force
          Copy-Item "$libDir\*.dll" libiio\bin                -Force -ErrorAction SilentlyContinue
          "LIBIIO_ROOT=$(Resolve-Path libiio)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (CMake, Win32 / x86)
        shell: pwsh
        run: cmake -S . -B build -A Win32 -DLIBIIO_ROOT="$env:LIBIIO_ROOT"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Stage release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build\Release\ExtIO_PlutoSDR.dll release\
          Copy-Item libiio\bin\*.dll release\ -Force -ErrorAction SilentlyContinue
          Copy-Item README.md release\ -ErrorAction SilentlyContinue
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtIO_PlutoSDR-win32
          path: release/**
          if-no-files-found: error
