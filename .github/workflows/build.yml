name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x86-windows
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache env (for vcpkg binary cache)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install libiio (32-bit) via vcpkg
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          Write-Host "Using vcpkg: $vcpkg"
          & $vcpkg install libiio:x86-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }

          $prefix = "$env:VCPKG_INSTALLATION_ROOT\installed\x86-windows"
          Write-Host "vcpkg prefix: $prefix"
          Write-Host "--- include ---"; Get-ChildItem "$prefix\include" -Filter iio.h -Recurse -ErrorAction SilentlyContinue
          Write-Host "--- lib ---";     Get-ChildItem "$prefix\lib"     -Filter "*iio*"
          Write-Host "--- bin ---";     Get-ChildItem "$prefix\bin"

          "LIBIIO_ROOT=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (CMake, Win32 / x86)
        shell: pwsh
        run: cmake -S . -B build -A Win32 -DLIBIIO_ROOT="$env:LIBIIO_ROOT"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Stage release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build\Release\ExtIO_PlutoSDR.dll release\
          Copy-Item "$env:LIBIIO_ROOT\bin\*.dll" release\ -Force -ErrorAction SilentlyContinue
          Copy-Item README.md release\ -ErrorAction SilentlyContinue
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtIO_PlutoSDR-win32
          path: release/**
          if-no-files-found: error
